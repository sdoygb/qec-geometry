[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qec-geometry"
version = "0.3.1"
description = "Geometric diagnostics for quantum error correction codes: A0/A1 error-pattern topology + threshold closed form + anyon typing"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ouyang Guobin" }]
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
demo = ["stim", "pymatching"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/sdoygb/qec-geometry"

[tool.setuptools]
packages = ["qecgeo"]
